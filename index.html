<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <script>
      // Defensive monkeypatch to prevent "TypeError: Cannot set property fetch of #<Window> which has only a getter"
      // This occurs in sandbox iframe preview environments when external browser extensions or injected scripts
      // attempt to override window.fetch.
      (function() {
        try {
          let originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return originalFetch;
            },
            set: function(val) {
              originalFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("Safe fetch monkeypatch warning:", e);
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام رقمنة وبحث الأرشيف - المديرية الجهوية للميزانية ورقلة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Amiri:ital,wght@0,400;0,700;1,400&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
